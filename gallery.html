<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="#0c1019" name="theme-color"/>
<meta content="A curated collection of photographs and images from The Jellyblossoms." name="description"/>
<title>Gallery — The Jellyblossoms</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="styles.css" rel="stylesheet"/>
<link href="assets/favicon.ico" rel="icon" sizes="any"/>
<link href="assets/favicon-512.png" rel="icon" sizes="512x512" type="image/png"/>
<link href="assets/apple-touch-icon.png" rel="apple-touch-icon"/>
<style>
    .social-links { display: flex; justify-content: center; align-items: center; gap: 12px; }
    .social-links a { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #f5f3ef; border-radius: 6px; text-decoration: none; transition: opacity 150ms ease; }
    .social-links a:hover { opacity: .7; }
    .social-links a:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; }
    .social-links svg { display: block; width: 24px; height: 24px; }
    .home-social-footer { margin-top: 16px; line-height: 1; }
.gallery { display: grid; gap: clamp(56px, 8vw, 112px); }
    .gallery figure { margin: 0; }
    .gallery-photo-link { display: block; width: fit-content; max-width: 100%; margin: 0 auto; cursor: zoom-in; }
    .gallery-photo { display: block; width: auto; height: auto; max-width: 100%; max-height: 85svh; }
    .gallery-caption { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px 28px; margin-top: 20px; color: var(--muted); font-size: .9rem; }
    .gallery-caption a { display: inline-block; padding: 8px 0; text-underline-offset: 5px; }
    .gallery-caption a:hover { color: var(--ink); text-decoration: underline; }
    .gallery a:focus-visible, .gallery-viewer button:focus-visible { outline: 2px solid var(--ink); outline-offset: 5px; }
    .gallery-viewer { border: 0; padding: 56px 16px 20px; width: 96vw; max-width: 1800px; max-height: 96svh; background: var(--bg); color: var(--ink); }
    .gallery-viewer::backdrop { background: rgba(0,0,0,.9); }
    .gallery-viewer img { display: block; width: auto; height: auto; max-width: 100%; max-height: 78svh; margin: 0 auto; }
    .gallery-close { position: absolute; right: 12px; top: 8px; width: 44px; height: 44px; border: 0; background: transparent; color: inherit; font-size: 30px; line-height: 1; cursor: pointer; }
</style>
</head>
<body class="content-page">
<header class="site-header">
<a aria-label="The Jellyblossoms — Home" class="brand" href="index.html">
<img alt="The Jellyblossoms" class="brand-logo" height="244" src="assets/jellyblossoms-logo.svg" width="1788"/>
</a>
<nav aria-label="Main navigation" class="nav">
<a href="music.html">Music</a>
<a href="videos.html">Videos</a>
<a aria-current="page" class="active" href="gallery.html">Gallery</a>
<a href="contact.html">Contact</a>
<a href="shop.html">Shop</a>
</nav>
</header>
<main class="container page-content">
  <h1 class="plain-title">Gallery</h1>
  <div class="gallery">
    <figure>
      <a class="gallery-photo-link" href="gallery-photo-01-full.png" data-gallery-open aria-label="View full-size photograph">
        <img class="gallery-photo" src="gallery-photo-01.jpg" width="1667" height="943" alt="Black-and-white portrait of Mizue holding a mug beside Tyler playing acoustic guitar." decoding="async"/>
      </a>
      <figcaption class="gallery-caption">
        <a href="gallery-photo-01-full.png" data-gallery-open>View full size</a>
        <a href="gallery-photo-01-full.png" download="The-Jellyblossoms-01.png">Download image</a>
      </figcaption>
    </figure>
  </div>
</main>
<footer class="footer">
    <nav class="social-links" aria-label="Footer social media">
      <a
        href="https://www.instagram.com/thejellyblossoms_official/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="The Jellyblossoms on Instagram (opens in a new tab)"
        title="Instagram"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
          focusable="false"
        >
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>

      <a
        href="https://www.youtube.com/@thejellyblossoms"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="The Jellyblossoms on YouTube (opens in a new tab)"
        title="YouTube"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          aria-hidden="true"
          focusable="false"
        >
          <path
            fill="currentColor"
            d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.2 3.6-6.2 3.6Z"
          />
        </svg>
      </a>
    </nav>
  </footer>

<dialog class="gallery-viewer" aria-label="Full-size photograph" id="gallery-viewer">
  <button class="gallery-close" type="button" aria-label="Close photograph">×</button>
  <img alt="Black-and-white portrait of Mizue holding a mug beside Tyler playing acoustic guitar."/>
</dialog>
<script>
  (() => {
    const viewer = document.getElementById('gallery-viewer');
    if (!viewer || typeof viewer.showModal !== 'function') return;
    const image = viewer.querySelector('img');
    let previousOverflow;
    document.querySelectorAll('[data-gallery-open]').forEach(link => {
      link.addEventListener('click', event => {
        if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
        event.preventDefault();
        image.src = link.href;
        previousOverflow = document.body.style.overflow;
        document.body.style.overflow = 'hidden';
        viewer.showModal();
      });
    });
    viewer.querySelector('button').addEventListener('click', () => viewer.close());
    viewer.addEventListener('click', event => {
      if (event.target !== viewer) return;
      const box = viewer.getBoundingClientRect();
      if (event.clientX < box.left || event.clientX > box.right || event.clientY < box.top || event.clientY > box.bottom) viewer.close();
    });
    viewer.addEventListener('close', () => { document.body.style.overflow = previousOverflow || ''; });
  })();
</script>
</body>
</html>
