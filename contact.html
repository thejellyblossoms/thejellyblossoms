<div>
<h1 class="plain-title">Contact</h1>
<form action="https://formspree.io/f/mvkkzzge" aria-label="Contact The Jellyblossoms" class="contact-form" id="contact-form" method="POST">
<label>Name<input autocomplete="name" maxlength="120" name="name" required=""/>
</label>
<label>Email<input autocomplete="email" name="email" required="" type="email"/>
</label>
<label>Message<textarea maxlength="10000" name="message" required="">
</textarea>
</label>
<button class="action" type="submit">Send message</button>
<p aria-live="polite" class="form-status" id="form-status" role="status">
</p>
</form>
