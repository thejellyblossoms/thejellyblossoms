      opacity: 0.7;
    }

    .social-links a:focus-visible {

      outline-offset: 3px;
    }

    .social-links svg {
      display: block;
      width: 24px;
      height: 24px;
    }

    .header-socials {
      position: absolute;
      top: 12px;
      right: clamp(16px, 3vw, 48px);
      z-index: 2;
    }

    @media (max-width: 600px) {
      .header-socials {
        position: static;
        width: 100%;
        margin-bottom: 12px;
      }

      .site-header {
        padding-top: 16px;
        flex-wrap: wrap;
      }
    }
